name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skills
        run: python scripts/validate_skills.py
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test installer
        run: python scripts/install_skills.py --all --destination build/installed-skills --dry-run
      - name: Smoke-test release packaging
        run: python scripts/package_release.py --output build/release --version 1.0.0
