name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate release
        run: |
          python scripts/validate_skills.py
          python -m unittest discover -s tests -v
      - name: Build deterministic archives
        run: python scripts/package_release.py --output dist --version "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "Consulting Skills Lab $GITHUB_REF_NAME"
